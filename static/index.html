<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clean Air Walk</title>
<meta name="description" content="When is the air clean enough to go outside? Ask in English or Hindi. Powered by open-weight Gemma 4.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2e7d4f">
<link rel="icon" href="/static/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/static/icons/icon-192.png">
<style>
:root{
  --bg:#f3f6f1; --card:#ffffff; --ink:#17231b; --muted:#5b6a60; --line:#dfe6dc;
  --accent:#2e7d4f; --accent-ink:#ffffff; --accent-soft:#e2f1e7; --bubble:#eef3ec; --shadow:0 1px 3px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1411; --card:#18201b; --ink:#e8efea; --muted:#9db0a3; --line:#2a352e;
    --accent:#5fc28a; --accent-ink:#0f1411; --accent-soft:#1d3226; --bubble:#222c25; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1411; --card:#18201b; --ink:#e8efea; --muted:#9db0a3; --line:#2a352e;
  --accent:#5fc28a; --accent-ink:#0f1411; --accent-soft:#1d3226; --bubble:#222c25; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Inter,"Noto Sans Devanagari",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px 16px 56px}
a{color:var(--accent)}
button{font:inherit;cursor:pointer;border-radius:12px}
.btn{padding:12px 18px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.6;cursor:wait}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.muted{color:var(--muted)}.small{font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}

/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;margin-right:auto}
.brand img{width:30px;height:30px;border-radius:8px}
.langsw{display:flex;border:2px solid var(--accent);border-radius:999px;overflow:hidden}
.langsw button{border:0;border-radius:0;padding:7px 14px;background:transparent;color:var(--accent);font-weight:700}
.langsw button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.search{display:flex;gap:8px;position:relative;margin-bottom:14px}
.search input{flex:1;min-width:0}
#suggest{position:absolute;top:54px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:12px;z-index:10;display:none;box-shadow:0 6px 20px rgba(0,0,0,.12)}
#suggest div{padding:12px 14px;cursor:pointer}#suggest div:hover{background:var(--accent-soft)}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.face{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-size:58px;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08)}
.place{font-size:14px;color:var(--muted)}
.verdict{font-size:clamp(24px,5vw,32px);font-weight:800;line-height:1.2;margin:2px 0 6px}
.advice{font-size:18px;margin:0 0 10px}
.best{display:inline-block;background:var(--accent-soft);border-radius:12px;padding:8px 12px;font-weight:700}
.official{font-size:13px;color:var(--muted);margin-top:8px}
@media (max-width:520px){.hero{grid-template-columns:1fr;text-align:center}.face{margin:0 auto}}

/* week strip */
.week{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.day{border-radius:14px;padding:10px 6px;text-align:center;border:1px solid var(--line);background:var(--card)}
.day .dn{font-weight:700;font-size:15px}
.day .em{font-size:30px;line-height:1.3}
.day .bt{font-weight:700;font-size:14px}
.day .bw{font-size:12px;color:var(--muted)}
@media (max-width:520px){
  .week{gap:5px}
  .day{padding:8px 2px;border-radius:12px}
  .day .dn{font-size:13px}.day .em{font-size:24px}.day .bt{font-size:12px;line-height:1.3}.day .bw{font-size:11px;line-height:1.25}
}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 12px}
.tabs button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:10px 4px;font-weight:700;font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:22px}
.tabs button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.panel[hidden]{display:none}

/* chat */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1.5px solid var(--line);background:var(--bubble);color:var(--ink);padding:9px 13px;font-size:15px;text-align:left}
#chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;max-height:460px;overflow-y:auto}
.msg{padding:12px 15px;border-radius:16px;max-width:90%;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.bot{align-self:flex-start;background:var(--bubble)}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0}
#mic{width:54px;flex:0 0 auto;font-size:22px;padding:0;border:2px solid var(--accent);background:transparent}
#mic.listening{background:#d9452f;border-color:#d9452f;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,69,47,.5)}50%{box-shadow:0 0 0 9px rgba(217,69,47,0)}}
@media (prefers-reduced-motion: reduce){#mic.listening{animation:none}}
.hint{min-height:22px;margin-top:6px}
.speak{background:none;border:none;color:var(--accent);padding:2px 4px;margin-left:6px;font-size:16px}

/* exercise */
.exhead{display:flex;gap:14px;align-items:center}
.exicon{font-size:46px}
.exadvice{font-size:19px;font-weight:700}
.exup{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--accent-soft)}
h3{font-size:17px;margin:18px 0 8px}
.list{margin:0;padding-left:22px}.list li{margin:6px 0}
.help{padding:12px 14px;border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:8px;font-size:15px}

/* sky */
.skyrow{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
#skyprev{max-width:200px;max-height:160px;border-radius:12px;display:none;margin-top:10px}
#skyout{flex:1 1 260px}
#skyout .head{font-weight:800;font-size:18px;margin-bottom:4px}

/* me */
.pgrid{display:grid;gap:10px}
.pgrid label.chk{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px}
.pgrid label.chk input{width:22px;height:22px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 label{display:flex;flex-direction:column;gap:4px;font-size:15px}
.saved{color:var(--accent);font-weight:700;min-height:22px}

/* details */
details.more summary{cursor:pointer;font-weight:700;font-size:17px;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸ ";color:var(--accent)}
details.more[open] summary::before{content:"▾ "}
.chartbox{position:relative;height:250px;margin-top:10px}
#status{padding:12px 14px;border-radius:12px;background:var(--accent-soft);margin-bottom:14px}
#offline{display:none;padding:12px 14px;border-radius:12px;background:#fff3cd;color:#5c4400;margin-bottom:14px}
#install{display:none}
footer{color:var(--muted);font-size:13px;margin-top:24px;text-align:center}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand"><img src="/static/icons/icon-192.png" alt=""> Clean Air Walk</div>
    <button id="install" class="btn ghost small" data-t="install">📲 Install</button>
    <div class="langsw" role="group" aria-label="Language">
      <button id="len" aria-pressed="true">English</button>
      <button id="lhi" aria-pressed="false" lang="hi">हिंदी</button>
    </div>
  </div>

  <div class="search">
    <input id="q" autocomplete="off" data-tp="search" aria-label="Search a place">
    <button id="loc" class="btn ghost" data-t="nearme">📍 Near me</button>
    <div id="suggest"></div>
  </div>

  <div id="offline" data-t="offline"></div>
  <div id="status"></div>

  <section id="out" hidden>
    <!-- 1. the big answer -->
    <div class="card hero" aria-live="polite">
      <div class="face" id="face">🙂</div>
      <div>
        <div class="place" id="place"></div>
        <div class="verdict" id="verdict"></div>
        <p class="advice" id="advice"></p>
        <div class="best" id="best"></div>
        <div class="official" id="official"></div>
      </div>
    </div>

    <!-- 2. next 5 days -->
    <div class="card">
      <div style="font-weight:800;margin-bottom:10px" data-t="week"></div>
      <div class="week" id="week"></div>
    </div>

    <!-- 3. tabs -->
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="ask"><span>💬</span><b data-t="tab_ask"></b></button>
      <button role="tab" aria-selected="false" data-tab="ex"><span>🏃</span><b data-t="tab_ex"></b></button>
      <button role="tab" aria-selected="false" data-tab="sky"><span>📷</span><b data-t="tab_sky"></b></button>
      <button role="tab" aria-selected="false" data-tab="me"><span>⚙️</span><b data-t="tab_me"></b></button>
    </div>

    <div class="card panel" id="p-ask" role="tabpanel">
      <div class="chips" id="chips"></div>
      <div id="chat" aria-live="polite"></div>
      <form class="ask" id="askform">
        <button type="button" id="mic" aria-label="Speak" hidden>🎤</button>
        <input id="askq" autocomplete="off" data-tp="askph" aria-label="Your question">
        <button class="btn" id="askbtn" data-t="ask"></button>
      </form>
      <div class="hint muted small" id="hint"></div>
      <p class="muted small" style="margin:6px 0 0" data-t="asknote"></p>
    </div>

    <div class="card panel" id="p-ex" role="tabpanel" hidden>
      <div class="exhead">
        <div class="exicon" id="exicon">🚶</div>
        <div><div class="exadvice" id="exadvice"></div><div class="muted small" id="exhealth"></div></div>
      </div>
      <div class="exup" id="exup" hidden></div>
      <h3 data-t="indoor"></h3>
      <ul class="list" id="exindoor"></ul>
      <button class="btn ghost" id="indoorbtn" data-t="indoorbtn" style="margin-top:6px"></button>
      <div class="msg bot" id="indoorout" hidden style="margin-top:10px;max-width:100%"></div>
      <h3 data-t="mood"></h3>
      <ul class="list" id="exmood"></ul>
      <p class="help" id="exhelp"></p>
      <p class="muted small" data-t="exsource"></p>
    </div>

    <div class="card panel" id="p-sky" role="tabpanel" hidden>
      <p style="margin-top:0" data-t="skyintro"></p>
      <div class="skyrow">
        <div>
          <input type="file" id="skyfile" accept="image/*" capture="environment" hidden>
          <button class="btn" id="skybtn" data-t="skybtn"></button><br>
          <img id="skyprev" alt="">
        </div>
        <div id="skyout" class="muted small" data-t="skytip"></div>
      </div>
    </div>

    <div class="card panel" id="p-me" role="tabpanel" hidden>
      <p style="margin-top:0" data-t="meintro"></p>
      <div class="pgrid" id="profilebox">
        <label class="chk"><input type="checkbox" name="cond" value="asthma"> <span data-t="c_asthma"></span></label>
        <label class="chk"><input type="checkbox" name="cond" value="heart_lung"> <span data-t="c_heart"></span></label>
        <label class="chk"><input type="checkbox" name="cond" value="elderly"> <span data-t="c_elderly"></span></label>
        <label class="chk"><input type="checkbox" name="cond" value="kids"> <span data-t="c_kids"></span></label>
        <label class="chk"><input type="checkbox" name="cond" value="pregnant"> <span data-t="c_preg"></span></label>
        <div class="row2">
          <label><span data-t="freefrom"></span><select id="pfrom"></select></label>
          <label><span data-t="freeuntil"></span><select id="puntil"></select></label>
        </div>
        <div class="row2">
          <label><span data-t="activity"></span><select id="pact"></select></label>
          <label><span data-t="howlong"></span><select id="pdur"></select></label>
        </div>
      </div>
      <div class="saved" id="saved"></div>
    </div>

    <!-- 4. more details -->
    <div class="card">
      <details class="more">
        <summary data-t="chart"></summary>
        <div class="chartbox"><canvas id="chart"></canvas></div>
      </details>
    </div>
    <div class="card" id="acccard" hidden>
      <details class="more">
        <summary data-t="acc"></summary>
        <p id="accnote"></p>
        <div class="chartbox" style="height:210px"><canvas id="accchart"></canvas></div>
      </details>
    </div>
    <div class="card">
      <details class="more" id="safety">
        <summary data-t="unwell"></summary>
        <ul class="list" id="safetylist"></ul>
        <p class="muted small" data-t="notmed"></p>
      </details>
    </div>
  </section>

  <footer>
    <span data-t="footer"></span><br>
    Gemma 4 · Copernicus CAMS via <a href="https://open-meteo.com">Open-Meteo</a> · <a href="https://openaq.org">OpenAQ</a> ·
    <a href="https://github.com/starkhushi/clean-air-walk">GitHub</a>
  </footer>
</main>

  .replace(/^[ \t]*[*-][ \t]+/gm, m => (m.match(/^[ \t]+/) ? '&nbsp;&nbsp;&nbsp;&nbsp;' : '') + '• ')
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

const h12 = h => h % 12 || 12;
const ampm = h => (h % 24) < 12 ? 'am' : 'pm';
const hiPart = h => { h %= 24; return h < 5 ? 'रात' : h < 12 ? 'सुबह' : h < 16 ? 'दोपहर' : h < 20 ? 'शाम' : 'रात'; };
function fmtHour(hh){
  const h = parseInt(hh, 10);

}
function fmtRange(s, e){                      // "7–9 pm", "11 am–1 pm", "शाम 7 से 9 बजे", "दोपहर 2 से शाम 4 बजे"
  s = parseInt(s, 10); e = parseInt(e, 10);

  return ampm(s) === ampm(e) ? `${h12(s)}–${h12(e)} ${ampm(e)}` : `${h12(s)} ${ampm(s)}–${h12(e)} ${ampm(e)}`;
}

function bandOf(pm, bands){ for(const b of bands){ if(b.max === null || pm <= b.max) return b; } return bands[bands.length - 1]; }

  const f = d.forecast, bands = d.bands;

  const b = bandOf(pm, bands);
  $('#face').textContent = face(b.label); $('#face').style.background = b.color;

  const labels = f.time.map(s => { const x = new Date(s.replace(' ', 'T')); return `${dayName(s.slice(0,10))} ${fmtHour(x.getHours())}`; });
  chart && chart.destroy();

  const a = d.accuracy;

  if(a){
    $('#accnote').innerHTML = t('accnote', {h:a.hours, m:a.mae, s:esc(d.sensor.name.split(' - ')[0]),
      bias:a.bias > 5 ? t('acchigh') : a.bias < -5 ? t('acclow') : t('accok')});
    accchart && accchart.destroy();
    accchart = new Chart($('#accchart'), {type:'line', data:{labels:a.series.time.map(s => dayName(s.slice(0,10)) + ' ' + fmtHour(s.slice(11,13))), datasets:[
      {label:LANG === 'hi' ? 'असली सेंसर' : 'Real sensor', data:a.series.sensor, borderColor:ink, borderWidth:2, pointRadius:0},

        scales:{x:{ticks:{color:muted, maxTicksLimit:6}, grid:{color:line}}, y:{ticks:{color:muted}, grid:{color:line}, beginAtZero:true}}}});

// ---------------------------------------------------------------- ask Gemma
function bubble(role, html){
  const el = document.createElement('div'); el.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  el.innerHTML = html; $('#chat').appendChild(el); $('#chat').scrollTop = $('#chat').scrollHeight; return el;
}
async function streamInto(el, res){
  const reader = res.body.getReader(), dec = new TextDecoder(); let text = '';
  for(;;){ const {value, done} = await reader.read(); if(done) break; text += dec.decode(value, {stream:true}); el.innerHTML = md(text); }
  return text;
}
function addSpeak(el, text){
  if(!TTS) return;
  const b = document.createElement('button'); b.className = 'speak'; b.type = 'button'; b.textContent = '🔊';
  b.setAttribute('aria-label', 'Read aloud'); b.onclick = () => speak(text); el.appendChild(b);
}
async function ask(q, viaVoice = false){
  q = q.trim(); if(!q) return;
  stopSpeaking(); $('#askq').value = ''; $('#askbtn').disabled = true;
  bubble('user', esc(q));
  const out = bubble('bot', `<span class="muted">${t('thinking')}</span>`);
  try{
    const r = await fetch('/api/ask', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({question:q, lat:place.lat, lon:place.lon, place:place.name, history, profile:getProfile()})});
    if(!r.ok) throw new Error(r.statusText);
    const text = await streamInto(out, r);
    history.push({role:'user', content:q}, {role:'assistant', content:text});
    addSpeak(out, text); if(viaVoice) speak(text);
  }catch(e){ out.textContent = 'Sorry: ' + e.message; }
  $('#askbtn').disabled = false; $('#chat').scrollTop = $('#chat').scrollHeight;
}
$('#askform').onsubmit = e => { e.preventDefault(); ask($('#askq').value); };
$('#chips').onclick = e => { const b = e.target.closest('.chip'); if(b) ask(b.textContent); };

// ---------------------------------------------------------------- voice (browser Web Speech API)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const TTS = 'speechSynthesis' in window;
let recog = null, listening = false;
function setHint(msg){ $('#hint').textContent = msg ?? (SR ? t('tapmic') : ''); }
if(SR){
  $('#mic').hidden = false;
  $('#mic').onclick = () => {
    if(listening){ recog && recog.stop(); return; }
    stopSpeaking();
    recog = new SR(); recog.lang = LANG === 'hi' ? 'hi-IN' : 'en-IN'; recog.interimResults = true; recog.continuous = false;
    let finalText = '';
    recog.onstart = () => { listening = true; $('#mic').classList.add('listening'); setHint(t('listen')); };
    recog.onresult = ev => { let interim = '';
      for(let i = ev.resultIndex; i < ev.results.length; i++){ const s = ev.results[i][0].transcript; if(ev.results[i].isFinal) finalText += s; else interim += s; }
      $('#askq').value = (finalText + interim).trim(); };
    recog.onerror = ev => setHint(ev.error === 'not-allowed' ? t('micblocked') : ev.error === 'no-speech' ? t('nospeech') : 'Voice error: ' + ev.error);
    recog.onend = () => { listening = false; $('#mic').classList.remove('listening');
      const q = ($('#askq').value || '').trim(); if(finalText.trim() && q){ setHint(); ask(q, true); } };
    try{ recog.start(); }catch(e){ setHint('Voice unavailable: ' + e.message); }
  };
}
function plainText(s){ return s.replace(/\*\*(.+?)\*\*/g, '$1').replace(/[*_`#>•]/g, '').replace(/\(Gemma[^)]*\)/, '').trim(); }
function stopSpeaking(){ if(TTS) speechSynthesis.cancel(); }
function speak(text){
  if(!TTS) return; stopSpeaking();
  const s = plainText(text), lang = /[ऀ-ॿ]/.test(s) ? 'hi-IN' : 'en-IN';
  const vs = speechSynthesis.getVoices(), voice = vs.find(v => v.lang === lang) || vs.find(v => v.lang.startsWith(lang.slice(0, 2)));
  for(const p of (s.match(/[^.!?।\n]+[.!?।]*/g) || [s])){ if(!p.trim()) continue;
    const u = new SpeechSynthesisUtterance(p.trim()); u.lang = lang; if(voice) u.voice = voice; speechSynthesis.speak(u); }
}
if(TTS) speechSynthesis.onvoiceschanged = () => {};

function resizeImage(file, maxSide = 1024){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', .85)); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that image.')); };
    img.src = url;
  });
}

$('#skyfile').onchange = async e => {
  const file = e.target.files[0]; if(!file) return;
  const out = $('#skyout'); $('#skybtn').disabled = true;
  try{
    const dataUrl = await resizeImage(file);
    $('#skyprev').src = dataUrl; $('#skyprev').style.display = 'block';
    out.className = ''; out.innerHTML = `<span class="muted">${t('looking')}</span>`;
    const r = await fetch('/api/sky', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:dataUrl, lat:place.lat, lon:place.lon, lang:LANG})});
    const j = await r.json(); if(!r.ok) throw new Error(j.detail || r.statusText);
    out.innerHTML = j.ok ? `<div class="head">${esc(j.headline)}</div><div>${esc(j.message)}</div>` : esc(j.message);
    if(j.ok) addSpeak(out, j.headline + ' ' + j.message);
  }catch(err){ out.textContent = t('skyfail') + err.message; }
  $('#skybtn').disabled = false; e.target.value = '';
};

// ---------------------------------------------------------------- place search
let tmr;
$('#q').addEventListener('input', e => {
  clearTimeout(tmr); const q = e.target.value.trim();
  if(q.length < 2){ $('#suggest').style.display = 'none'; return; }
  tmr = setTimeout(async () => {
    const r = await fetch('/api/geocode?q=' + encodeURIComponent(q)); const list = r.ok ? await r.json() : [];
    $('#suggest').innerHTML = list.map((p, i) => `<div data-i="${i}">${esc(p.name)}<span class="muted small">, ${esc([p.admin, p.country].filter(Boolean).join(', '))}</span></div>`).join('');
    $('#suggest').style.display = list.length ? 'block' : 'none';
    $('#suggest').onclick = ev => { const el = ev.target.closest('[data-i]'); if(!el) return; const p = list[+el.dataset.i];
      $('#suggest').style.display = 'none'; $('#q').value = p.name; load(p.lat, p.lon, p.name); };
  }, 300);
});
$('#loc').onclick = () => navigator.geolocation.getCurrentPosition(
  p => load(+p.coords.latitude.toFixed(4), +p.coords.longitude.toFixed(4), LANG === 'hi' ? 'आपकी जगह' : 'your location'),
  () => { $('#status').hidden = false; $('#status').textContent = LANG === 'hi' ? 'लोकेशन की अनुमति नहीं मिली। जगह खोजें।' : 'Location permission denied. Search for a place instead.'; });

// ---------------------------------------------------------------- installable app + offline
if('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#install').style.display = 'inline-block'; });
$('#install').onclick = async () => { if(!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $('#install').style.display = 'none'; };
window.addEventListener('appinstalled', () => { $('#install').style.display = 'none'; });
function netStatus(){ $('#offline').style.display = navigator.onLine ? 'none' : 'block'; }
window.addEventListener('online', netStatus); window.addEventListener('offline', netStatus); netStatus();

applyLang();
const urlTab = new URLSearchParams(location.search).get('tab');      // shareable: /?tab=ex
if(urlTab){ const b = document.querySelector(`.tabs button[data-tab="${CSS.escape(urlTab)}"]`); if(b) b.click(); }
load(place.lat, place.lon, place.name);
</script>
</body>
