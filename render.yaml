services:
  - type: web
    name: clean-air-walk
    runtime: python
    plan: starter          # 0.5 CPU / 512 MB is plenty: Gemma runs via the Gemini API.
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false        # free key from https://aistudio.google.com/apikey
      - key: OPENAQ_API_KEY
        sync: false        # free key from https://explore.openaq.org
      - key: LLM_BACKEND
        value: gemini
      - key: GEMINI_MODEL
        value: gemma-4-26b-a4b-it
